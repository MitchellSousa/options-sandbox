<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Options Sandbox</title>

  <link rel="stylesheet" href="src/style.css">
  <script type="module" src="src/main.js"></script>
</head>

<body>
  <main>
    <h1>Options Sandbox</h1>

    <p>Learn how options work by changing the numbers</p>

    <label for="option-type">Option type:</label>
    <select id="option-type">
      <option value="call">Long Call</option>
      <option value="put">Long Put</option>
    </select>

    <label for="stock-price">Stock price at expiration:</label>
    <input id="stock-price" type="number" value="120" step="0.01">

    <label for="stock-slider">Try a different stock price:</label>
    <input id="stock-slider" type="range" min="0" max="200" value="120" step="0.50">

<output id="stock-slider-value" class="slider-value">$120.00</output>

    <label for="strike-price">Strike price:</label>
    <input id="strike-price" type="number" value="100" step="0.01">

    <label for="premium">Premium paid per share:</label>
    <input id="premium" type="number" value="5" step="0.01">

    <label for="contracts">Number of contracts:</label>
    <input id="contracts" type="number" value="1" min="1" step="1">

    <label for="bid">Bid price:</label>
    <input id="bid" type="number" value="2.80" step="0.01">

    <label for="ask">Ask price:</label>
    <input id="ask" type="number" value="3.00" step="0.01">

    <button id="calculate-button">Calculate</button>

    <button id="save-original-button" class="secondary-button">Set current scenario as original</button>

    <section class="results" aria-live="polite">
      <h2>Scenario results</h2>

      <p id="message-result" class="message-result"></p>

      <div class="result-grid">
        <article class="result-card">
          <span class="result-label">Profit / loss per share</span>
          <strong id="profit-result" class="result-value">—</strong>
        </article>

        <article class="result-card">
          <span class="result-label">Total profit / loss</span>
          <strong id="contract-profit-result" class="result-value">—</strong>
        </article>

        <article class="result-card">
          <span class="result-label">Maximum loss</span>
          <strong id="max-loss-result" class="result-value">—</strong>
        </article>

        <article class="result-card">
          <span class="result-label">Break-even price</span>
          <strong id="break-even-result" class="result-value">—</strong>
        </article>

        <article class="result-card">
          <span class="result-label">Bid / ask spread</span>
          <strong id="spread-result" class="result-value">—</strong>
        </article>
      </div>

    </section>

    <section class="comparison" aria-live="polite">
      <h2>Compared with original</h2>
      <p id="comparison-result">
        Set a scenario as original, then move the slider to compare outcomes.
      </p>
    </section>
  </main>
</body>
</html>
